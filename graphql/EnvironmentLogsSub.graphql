subscription EnvironmentLogsSub(
  $environmentId: String!
  $filter: String
  $beforeLimit: Int
  $beforeDate: String
  $anchorDate: String
  $afterDate: String
  $afterLimit: Int
) {
  environmentLogs(
    environmentId: $environmentId
    filter: $filter
    beforeLimit: $beforeLimit
    beforeDate: $beforeDate
    anchorDate: $anchorDate
    afterDate: $afterDate
    afterLimit: $afterLimit
  ) {
    timestamp
    message
    attributes {
      key
      value
    }
  }
}
