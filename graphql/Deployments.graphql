query Deployments(
  $projectId: String!
  $environmentId: String!
  $serviceId: String!
  $first: Int!
) {
  deployments(
    input: {
      projectId: $projectId
      environmentId: $environmentId
      serviceId: $serviceId
    }
    first: $first
  ) {
    edges {
      node {
        ...DeploymentFields
      }
    }
  }
}

fragment DeploymentFields on Deployment {
  id
  status
  createdAt
  meta
  instances {
    id
    status
  }
}
